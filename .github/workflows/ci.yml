name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall app
      - run: |
          mkdir dist
          cp -r app dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      DB_PASSWORD: SuperSecret123
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy dengan password $DB_PASSWORD"
      - run: sh deploy.sh
